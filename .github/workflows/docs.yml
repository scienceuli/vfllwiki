name: Deploy Zensical to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: zensical build --strict  # writes ./site

      - run: python .github/scripts/zensical_backlinks.py site

      - run: npm i -g vercel@latest

      # links the runner to your Vercel project (.vercel/project.json)
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # wrap ./site in Vercel's Build Output API format
      - run: |
          mkdir -p .vercel/output
          cp -r site .vercel/output/static
          echo '{"version":3}' > .vercel/output/config.json

      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}